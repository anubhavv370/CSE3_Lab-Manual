<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>experiment4</title>
</head>
<body>
 
        <center>
            <h1>Hotel Room Booking Form</h1>

            <form action="./Responses.html" >
                <p>
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required>
                </p>

                <p>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </p>

                <p>
                    <label for="phone">Phone:</label>
                    <input type="tel" id="phone" name="phone" maxlength="10" required>
                </p>

                <p>
                    <label for="checkin">Check-in Date:</label>
                    <input type="date" id="checkin" name="checkin" required>
                </p>

                <p>
                    <label for="checkout">Check-out Date:</label>
                    <input type="date" id="checkout" name="checkout" required>
                </p>

                <p>
                    <label for="roomtype">Room Type:</label>
                    <select id="roomtype" name="roomtype" required>
                        <option value="single">Single Room</option>
                        <option value="double">Double Room</option>
                        <option value="suite">Suite</option>
                    </select>
                </p>

                <p>
                    <label for="guests">Number of Guests:</label>
                    <input type="number" id="guests" name="guests" min="1" max="5" required>
                </p>

                <p>
                    <label for="requests">Special Requests:</label><br>
                    <textarea id="requests" name="requests" rows="4" cols="40"></textarea>
                </p>

                <p>
                    <input type="submit" value="Book Now">
                    <input type="reset" value="Reset Form">
                </p>
            </form>
        </center>
    </div>
    
</body>
</html>
